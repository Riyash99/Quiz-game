<!DOCTYPE html>
<html>
<head>
  <title>Bulk Upload Questions</title>
</head>
<body style="font-family: sans-serif; padding: 20px; max-width: 700px;">
  <h1>Bulk Upload Questions</h1>
  <p>Paste rows copied from Excel below (columns: Question, OptionA, OptionB, OptionC, OptionD, CorrectAnswer, Category — no header row).</p>

  <textarea id="dataInput" rows="15" style="width:100%; font-family: monospace;"></textarea><br><br>
  <button onclick="uploadQuestions()">Upload to Firestore</button>
  <p id="status"></p>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCnpJBDbEM7QGg_NYyCiwdKANrPYse9RUI",
      authDomain: "quiz-game-c2313.firebaseapp.com",
      projectId: "quiz-game-c2313",
      storageBucket: "quiz-game-c2313.firebasestorage.app",
      messagingSenderId: "1057216158854",
      appId: "1:1057216158854:web:4ab1edca597b45f97a8507",
      measurementId: "G-SQ23Z2FJS0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function uploadQuestions() {
      const raw = document.getElementById("dataInput").value.trim();
      if (!raw) {
        alert("Paste some rows first.");
        return;
      }

      const rows = raw.split("\n").filter(r => r.trim() !== "");
      let successCount = 0;
      let errorRows = [];

      document.getElementById("status").innerText = "Uploading...";

      for (let i = 0; i < rows.length; i++) {
        const cols = rows[i].split("\t"); // tab-separated, matches Excel paste

        if (cols.length < 7) {
          errorRows.push(i + 1);
          continue;
        }

        const [question, optionA, optionB, optionC, optionD, correctAnswer, category] = cols;

        try {
          await db.collection("Questions").add({
            Question: question.trim(),
            OptionA: optionA.trim(),
            OptionB: optionB.trim(),
            OptionC: optionC.trim(),
            OptionD: optionD.trim(),
            CorrectAnswer: correctAnswer.trim(),
            Category: category.trim()
          });
          successCount++;
        } catch (err) {
          errorRows.push(i + 1);
          console.error("Row " + (i + 1) + " failed:", err);
        }
      }

      let statusMsg = "Done. " + successCount + " of " + rows.length + " questions uploaded.";
      if (errorRows.length > 0) {
        statusMsg += " Problem rows: " + errorRows.join(", ") + " (check column count/format).";
      }
      document.getElementById("status").innerText = statusMsg;
    }
  </script>
</body>
</html>
